services:
  postgres:
    image: postgres:16
    container_name: transit_data_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transit_data_hub}
      POSTGRES_USER: ${POSTGRES_USER:-transit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit_pass}
    ports:
      - "5432:5432"
    volumes:
      - transit_pg_data:/var/lib/postgresql/data
      # scripts here run once, in filename order, the first time the volume is created
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transit_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  transit_pg_data:
